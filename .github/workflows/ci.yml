name: ReconDesk CI
on: [push, pull_request, workflow_dispatch]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: '1'
      DEBUG: '1'
      SECRET_KEY: ci-demo-not-a-production-secret
      MATCHER_SHARED_TOKEN: dev-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows.txt
      - run: ruff check --select E4,E7,E9,F821 config core flask_matcher tests scripts
      - run: python -m compileall -q config core flask_matcher tests scripts
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python -m pytest -q -m "not mysql"
      - run: python scripts/evaluate.py
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: recondesk
          MYSQL_USER: recondesk
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DEBUG: '1'
      SECRET_KEY: ci-demo-not-a-production-secret
      MYSQL_DATABASE: recondesk
      MYSQL_USER: recondesk
      MYSQL_PASSWORD: test_password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MATCHER_SHARED_TOKEN: dev-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r requirements-mysql.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python -m pytest -q
