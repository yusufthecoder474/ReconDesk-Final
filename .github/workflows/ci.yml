
name: ReconDesk CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sqlite:
    name: SQLite - Lint, Tests and Evaluation
    runs-on: ubuntu-latest

    env:
      USE_SQLITE: "1"
      DEBUG: "1"
      SECRET_KEY: ci-demo-not-a-production-secret
      MATCHER_SHARED_TOKEN: dev-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Ruff lint checks
        run: |
          python -m ruff check --select E4,E7,E9,F821 config core flask_matcher tests scripts

      - name: Python syntax checks
        run: |
          python -m compileall -q config core flask_matcher tests scripts

      - name: Django system checks
        run: |
          python manage.py check

      - name: Check migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Apply SQLite migrations
        run: |
          python manage.py migrate --noinput

      - name: Run SQLite-compatible tests
        run: |
          python -m pytest -q -rs -m "not mysql"

      - name: Run research evaluation
        run: |
          python scripts/evaluate.py

  mysql:
    name: MySQL 8.4 - Integration and Concurrency Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: recondesk
          MYSQL_USER: recondesk
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DEBUG: "1"
      SECRET_KEY: ci-demo-not-a-production-secret

      MYSQL_DATABASE: recondesk

      # Root is used only for this disposable CI database.
      # Django needs permission to create test_recondesk.
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password

      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MATCHER_SHARED_TOKEN: dev-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mysql.txt

      - name: Install MySQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mysql.txt
          python -m pip install "ruff>=0.9,<1"

      - name: Ruff lint checks
        run: |
          python -m ruff check --select E4,E7,E9,F821 config core flask_matcher tests scripts

      - name: Django system checks
        run: |
          python manage.py check

      - name: Check migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Apply MySQL migrations
        run: |
          python manage.py migrate --noinput

      - name: Run MySQL integration and concurrency tests
        run: |
          python -m pytest -q -rs
