<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReconDesk</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container">
<a class="navbar-brand fw-bold" href="/">ReconDesk</a>
<div class="d-flex flex-wrap align-items-center gap-3">
<a class="link-light" href="{% url 'customers' %}">Customers</a>
<a class="link-light" href="{% url 'invoices' %}">Invoices</a>
<a class="link-light" href="{% url 'payments' %}">Payments</a>
<a class="link-light" href="{% url 'reconcile' %}">Reconcile</a>
<a class="link-light" href="{% url 'export' %}">CSV report</a>
{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Logout</button></form>{% endif %}
</div></div></nav>
<main class="container py-4">
{% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }}" role="alert">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
<footer class="text-muted small mt-5">Synthetic demonstration data only · Not accounting advice or production financial software.</footer>
</main></body></html>
